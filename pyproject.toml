"app/ideas_sheet_sync.py" = ["F402", "I001"]
"app/inline_keyboards.py" = ["E501"]
"app/main.py" = ["E501", "F401", "I001"]
"app/mcp_server.py" = ["E501", "I001"]
"app/new_person_flow.py" = ["E501"]
"app/people_sheet_sync.py" = ["E501", "F402", "I001"]
"app/projects_sheet_sync.py" = ["F402", "I001"]
"app/sheet_sync_common.py" = ["E501"]
"app/sheets_sync.py" = ["E501"]
